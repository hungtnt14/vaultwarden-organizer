<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Vault Organizer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2'%3E%3Crect x='3' y='11' width='18' height='10' rx='2'/%3E%3Cpath d='M7 11V7a5 5 0 0 1 10 0v4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" class="ico"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span>Vault Organizer</span>
    </div>
    <div class="status" id="status"></div>
    <div class="actions">
      <button id="btnOpen" class="btn" title="Mở file JSON (Ctrl+O)">Mở file</button>
      <button id="btnUndo" class="btn" title="Hoàn tác (Ctrl+Z)" disabled>↶ Hoàn tác</button>
      <button id="btnRedo" class="btn" title="Làm lại (Ctrl+Y)" disabled>↷</button>
      <button id="btnExport" class="btn primary" title="Xuất JSON (Ctrl+S)" disabled>Xuất JSON</button>
    </div>
    <input type="file" id="fileInput" accept=".json,application/json" hidden>
  </header>

  <main class="layout">
    <section class="pane tree-pane">
      <div class="tree-tools">
        <input type="search" id="search" placeholder="Tìm theo tên, username, URL, ghi chú…  ( / )" disabled>
        <div class="tool-row">
          <button class="btn sm" id="btnNewRootCol" disabled>+ Collection</button>
          <button class="btn sm" id="btnExpandAll" disabled title="Mở tất cả collection">⊞ Mở hết</button>
          <button class="btn sm" id="btnCollapseAll" disabled title="Thu gọn tất cả collection">⊟ Thu hết</button>
          <span class="hint" id="dragHint">Kéo để chuyển · giữ <kbd>Ctrl</kbd> khi thả để thêm vào nhiều collection</span>
        </div>
      </div>
      <div class="tree" id="tree" tabindex="-1"></div>
    </section>
    <section class="pane editor-pane" id="editor"></section>
  </main>

  <div class="drop-overlay" id="dropOverlay"><div>Thả file JSON vào đây</div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="exportDlg">
    <form method="dialog" class="dlg">
      <h2>Xuất file JSON</h2>
      <fieldset>
        <legend>Định dạng</legend>
        <label class="radio"><input type="radio" name="format" value="org"> Organization (collections) — import vào Organization</label>
        <label class="radio"><input type="radio" name="format" value="personal"> Cá nhân (folders) — import vào My Vault</label>
      </fieldset>
      <label class="check">
        <input type="checkbox" name="newIds" checked>
        <span>Tạo ID mới cho collection/folder <small>(khuyên dùng — Vaultwarden giữ nguyên tên cũ nếu ID đã tồn tại trong vault, khiến việc đổi tên/di chuyển bị mất)</small></span>
      </label>
      <label class="field">
        <span>Tên file</span>
        <input type="text" name="filename" required>
      </label>
      <ul class="warnings" id="exportWarnings"></ul>
      <p class="note">File xuất ra chứa mật khẩu dạng <b>không mã hóa</b>. Xóa file sau khi import xong.</p>
      <div class="dlg-actions">
        <button value="cancel" class="btn" formnovalidate>Hủy</button>
        <button value="ok" class="btn primary">Tải xuống</button>
      </div>
    </form>
  </dialog>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
